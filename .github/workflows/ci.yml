name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: bun install --cwd vendor/pocketjs --frozen-lockfile
      - run: bun scripts/setup.ts
      - run: bun run check
      - run: bun run build

  linux-web:
    name: Linux distribution + WASM preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install gpui Linux dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          clang cmake pkg-config libasound2-dev libfontconfig-dev libglib2.0-dev
          libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev
          libxkbcommon-x11-dev libzstd-dev mesa-vulkan-drivers xvfb xauth
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/pocketjs/engine/backends/gpui
            vendor/pocketjs/hosts/desktop
            vendor/pocketjs/engine/wasm
      - run: bun install --cwd vendor/pocketjs --frozen-lockfile
      - run: bun scripts/setup.ts
      - run: bun run check
      - run: bun run package:linux
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - name: Exercise the interactive WASM System preview
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bun run test:web
      - name: Launch the packaged System under X11
        run: >-
          timeout 30s xvfb-run -a
          dist/linux-app/PocketDesktop/bin/pocket-desktop --quit-after 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-desktop-linux-web
          path: |
            dist/linux-app/pocket-desktop-linux-*.tar.gz
            dist/web
            dist/web-smoke.png
          if-no-files-found: error
